[package]
name = "five_kd"
version = "1.0.0"
edition = "2021"
description = "5KD - 5wi's Kick Downloader (Native Rust GUI with Integrated VOD Extractor)"

[dependencies]
eframe = "0.29"
egui = "0.29"
rfd = "0.15"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[build-dependencies]
winres = "0.1"
