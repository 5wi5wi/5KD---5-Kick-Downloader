name: Build & Release Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build 5KD.exe (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build optimized release binary (5KD.exe)
        run: cargo build --release

      - name: Upload 5KD.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5KD-windows-x64
          path: target/release/5KD.exe

      - name: Create GitHub Release (on tag push or manual run)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' || github.ref_name == 'master' ? 'v1.0.0' : github.ref_name }}
          name: "5KD - 5wi's Kick Downloader (${{ github.ref_name }})"
          body: |
            ### 5KD — 5wi's Kick Downloader (Windows x64 Release)
            - Standalone native Rust executable (`5KD.exe`) with integrated Kick VOD M3U8 extractor.
            - Requires `yt-dlp` and `ffmpeg` installed in your Windows `PATH`.
          files: |
            target/release/5KD.exe
          draft: false
          prerelease: false
