name: Multi-Platform Release Build

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '*v'
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. 1.0v or v1.1.0)'
        required: false
        default: '1.0v'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: Windows x86_64 Installer
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: 5KD.exe
            setup_base: 5KD-windows-x86_64-setup
            iss_arch: x64compatible
            installer_asset: 5KD-windows-x86_64-setup.exe

          - platform_name: Windows ARM64 Installer
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bin_name: 5KD.exe
            setup_base: 5KD-windows-arm64-setup
            iss_arch: arm64
            installer_asset: 5KD-windows-arm64-setup.exe

          - platform_name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: 5KD
            asset_name: 5KD-linux-x86_64
            archive_name: 5KD-linux-x86_64.tar.gz
            installer_asset: 5KD-linux-x86_64.tar.gz

          - platform_name: macOS Apple Silicon (ARM64)
            os: macos-15-intel
            target: aarch64-apple-darwin
            bin_name: 5KD
            asset_name: 5KD-macos-arm64
            archive_name: 5KD-macos-arm64.tar.gz
            installer_asset: 5KD-macos-arm64.tar.gz

          - platform_name: macOS Intel (x86_64)
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin_name: 5KD
            asset_name: 5KD-macos-x86_64
            archive_name: 5KD-macos-x86_64.tar.gz
            installer_asset: 5KD-macos-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve Build Metadata (Version, Repo, Installer Asset)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="1.0v"
          fi
          echo "FIVEKD_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "FIVEKD_GITHUB_REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          echo "FIVEKD_INSTALLER_ASSET=${{ matrix.installer_asset }}" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} || cargo build --release --target ${{ matrix.target }}

      - name: Compile Windows Setup Wizard Installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $srcExe = "target\${{ matrix.target }}\release\${{ matrix.bin_name }}"
          & $iscc "installer.iss" `
            "/DMyAppVersion=$env:FIVEKD_RELEASE_TAG" `
            "/DMySourceExe=$srcExe" `
            "/DMyOutputDir=dist" `
            "/DMyOutputBaseFilename=${{ matrix.setup_base }}" `
            "/DMyArchMode=${{ matrix.iss_arch }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      - name: Package Unix release archive (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging dist
          SRC="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          chmod +x "$SRC"
          cp "$SRC" "staging/${{ matrix.asset_name }}"
          tar -czf "dist/${{ matrix.archive_name }}" -C staging "${{ matrix.asset_name }}"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Multi-Platform GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve Release Tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="1.0v"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Remove legacy assets from release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          LEGACY_ASSETS=(
            "5KD.exe"
            "5KD-windows-x86_64.exe"
            "5KD-windows-arm64.exe"
            "5KD-windows-x86_64.zip"
            "5KD-windows-arm64.zip"
            "5KD-linux-x86_64"
            "5KD-macos-arm64"
            "5KD-macos-x86_64"
            "SHA256SUMS.txt"
          )
          for asset in "${LEGACY_ASSETS[@]}"; do
            gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes 2>/dev/null || true
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: "5KD - 5wi's Kick Downloader (${{ steps.resolve_tag.outputs.tag }})"
          body: |
            ## 5KD — 5wi's Kick Downloader `${{ steps.resolve_tag.outputs.tag }}`

            ### Installers & Packages
            | Platform | Architecture | Package |
            | :--- | :--- | :--- |
            | **Windows** | x86_64 (64-bit) | `5KD-windows-x86_64-setup.exe` *(Windows Setup Wizard Installer)* |
            | **Windows** | ARM64 | `5KD-windows-arm64-setup.exe` *(Windows Setup Wizard Installer)* |
            | **Linux** | x86_64 (64-bit) | `5KD-linux-x86_64.tar.gz` |
            | **macOS** | Apple Silicon (M1–M4) | `5KD-macos-arm64.tar.gz` |
            | **macOS** | Intel (x86_64) | `5KD-macos-x86_64.tar.gz` |

            ### Highlights
            - **Precise Frame- & Duration-Based Download Progress**: Probes HLS M3U8 `#EXTINF` segment durations & `FRAME-RATE` (and `ffprobe` `nb_frames`/FPS/duration for MP4 clips) before downloading, adjusts targets automatically for Start/End time slicing (`-ss` / `-to`), reads live `\r`/`\n` `ffmpeg` updates in real time, and shows 1-decimal percentage progress (`0.0%`–`99.9%` → `100%`) alongside `Frame X / Y · HH:MM:SS / HH:MM:SS · speed`.
            - **Unified Geometric App Icon**: Upgraded the Windows `.exe` & setup wizard installer icon (`16×16`–`256×256` multi-size anti-aliased `.ico` with transparent rounded corners) and the runtime window/taskbar icon (`128×128`) to match the in-app `#00E701` geometric "5" brand mark.
            - **In-App Auto-Updater**: Check for new GitHub releases directly inside the **About** tab or automatically on launch—downloads the matching platform installer directly inside the app with zero browser tabs, installs silently, cleans up temporary installer files, and restarts automatically.
            - **Fast Windows Setup Wizard Installer**: Native LZMA2-compressed installer with Start Menu shortcut, optional Desktop shortcut, embedded `#00E701` geometric icon, and uninstaller support.
            - **VOD & Clip Title File Naming**: Automatically names downloaded files after the actual Kick VOD or Clip title.
            - **Persistent Output Folder**: Automatically remembers your chosen output folder, quality, container format, and zoom level across restarts.
            - **Integrated Kick VOD & Clip Extractor**: Resolves `v1/video/{uuid}`, UUIDv7 `v2/channels/{user}/videos`, `v2/clips/{clip_id}`, and CDN prefixes (`prefixes.json`) with silent background fallbacks.
            - **Multi-Threaded HLS Engine**: Powered by `yt-dlp` (`-N 8`) and `ffmpeg` with lossless time slicing (`-ss` / `-to`).

            ### Requirements
            - `yt-dlp` and `ffmpeg` (including `ffprobe`) installed and available in your system `PATH`:
              - **Windows**: `winget install yt-dlp.yt-dlp Gyan.FFmpeg`
              - **macOS**: `brew install yt-dlp ffmpeg`
              - **Linux**: `sudo apt install yt-dlp ffmpeg`
          files: |
            release-assets/*
          draft: false
          prerelease: false
